name: Daily Mutual Fund Data Refresh

on:
  schedule:
    # Runs at 03:45 UTC every day (9:15 AM IST)
    - cron: '45 3 * * *'
  workflow_dispatch: # Allows manual triggering from the GitHub UI

jobs:
  refresh-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'
        
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Run Phase 1 (Data Collection)
      run: python -m src.phase1_data_collection.scraper
      
    - name: Run Phase 2.1 (Data Extraction)
      run: python -m src.phase2_knowledge_base.extractor
      
    - name: Run Phase 2.2 & 2.3 (Chunking & Tagging)
      run: python -m src.phase2_knowledge_base.chunker
      
    - name: Run Phase 2.4 & 2.5 (Vector DB Ingestion)
      run: python -m src.phase2_knowledge_base.vector_db
      
    - name: Commit and Push Updated Data
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "chore(data): Daily refresh of mutual fund data and Vector DB"
        file_pattern: "data/**"
